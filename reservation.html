<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réserver · Suzy Coiffure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Réservez en ligne chez Suzy Coiffure, Neuchâtel : choisissez votre prestation, votre coiffeuse et un créneau libre.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="subpage">

<div class="cursor" id="cursor" aria-hidden="true"><span class="cursor-label" id="cursorLabel"></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo" aria-label="Suzy Coiffure">
      <span class="logo-s">Suzy</span><span class="logo-c">Coiffure</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="realisations.html" data-i18n="nav.works"></a>
      <a href="tarifs.html" data-i18n="nav.prices"></a>
      <a href="index.html#equipe" data-i18n="nav.team"></a>
      <a href="index.html#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Langue">
        <button type="button" data-lang="fr" class="is-active">FR</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
      <a href="reservation.html" class="btn btn-gold btn-sm magnetic" data-i18n="nav.book"></a>
      <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
      <a href="index.html" data-i18n="nav.home"></a>
      <a href="realisations.html" data-i18n="nav.works"></a>
      <a href="tarifs.html" data-i18n="nav.prices"></a>
      <a href="index.html#equipe" data-i18n="nav.team"></a>
      <a href="index.html#contact" data-i18n="nav.contact"></a>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="page-hero-bg" style="background-image:url(assets/img/work/ig-74.jpg)"></div>
    <div class="page-hero-veil" aria-hidden="true"></div>
    <div class="wrap page-hero-inner">
      <a class="crumb reveal-up" href="index.html">← <span data-i18n="page.back"></span></a>
      <p class="eyebrow reveal-up" data-i18n="book.eyebrow"></p>
      <h1 class="h1 reveal-lines" data-i18n-html="book.title"></h1>
      <p class="page-intro reveal-up" data-i18n="book.intro"></p>
    </div>
  </section>

  <section class="section booking" id="booking">
    <div class="wrap bk-layout">
      <div class="bk-main">
        <div id="bkFlow">
          <div class="bk-step" id="bkStep1">
            <h2 class="bk-h"><span class="bk-n">1</span><span data-i18n="book.s1"></span></h2>
            <div class="srv-tabs bk-tabs" id="bkTabs" role="tablist"></div>
            <div class="bk-services" id="bkServices"></div>
          </div>
          <div class="bk-step" id="bkStep2">
            <h2 class="bk-h"><span class="bk-n">2</span><span data-i18n="book.s2"></span></h2>
            <div class="bk-stylists" id="bkStylists"></div>
          </div>
          <div class="bk-step" id="bkStep3">
            <h2 class="bk-h"><span class="bk-n">3</span><span data-i18n="book.s3"></span></h2>
            <div class="bk-days" id="bkDays"></div>
          </div>
          <div class="bk-step" id="bkStep4">
            <div class="bk-h-row">
              <h2 class="bk-h"><span class="bk-n">4</span><span data-i18n="book.s4"></span></h2>
              <div class="bk-legend"><span class="lg lg-free" data-i18n="book.free"></span><span class="lg lg-taken" data-i18n="book.taken"></span><span class="lg-note" data-i18n="book.legend"></span></div>
            </div>
            <div id="bkSlots"></div>
          </div>
          <form class="bk-step" id="bkForm" novalidate>
            <h2 class="bk-h"><span class="bk-n">5</span><span data-i18n="book.s5"></span></h2>
            <div class="bk-fields">
              <label class="field"><span data-i18n="book.name"></span><input id="bkName" name="name" autocomplete="name" required></label>
              <label class="field"><span data-i18n="book.phone"></span><input id="bkPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
              <label class="field"><span data-i18n="book.email"></span><input id="bkEmail" name="email" type="email" autocomplete="email"></label>
              <label class="field field-wide"><span data-i18n="book.note"></span><textarea id="bkNote" name="note" rows="3" data-i18n-ph="book.notePh"></textarea></label>
            </div>
            <p class="bk-error" id="bkError" role="alert"></p>
            <button type="submit" class="btn btn-gold bk-submit-mobile" form="bkForm"><span data-i18n="book.confirm"></span></button>
          </form>
        </div>

        <div class="bk-done" id="bkDone" hidden>
          <span class="bk-done-mark" aria-hidden="true">✓</span>
          <h2 class="h2" data-i18n="book.doneTitle"></h2>
          <p class="bk-done-text" id="bkDoneText"></p>
          <p class="bk-demo" data-i18n="book.demo"></p>
          <div class="bk-done-actions">
            <button type="button" class="btn btn-gold" id="bkAgain"><span data-i18n="book.again"></span></button>
            <a class="btn btn-ghost-dark" href="index.html"><span data-i18n="page.back"></span></a>
          </div>
        </div>
      </div>

      <aside class="bk-aside">
        <div class="bk-card">
          <h2 class="bk-card-title" data-i18n="book.summary"></h2>
          <div id="bkSummary"></div>
          <button type="submit" class="btn btn-gold bk-submit" id="bkSubmit" form="bkForm" disabled><span data-i18n="book.confirm"></span></button>
          <p class="bk-hint" id="bkHint"></p>
        </div>
        <div class="bk-call">
          <p data-i18n="book.or"></p>
          <a class="phone" href="tel:+41763213239">076 321 32 39</a>
          <p class="muted small" data-i18n="info.monday"></p>
        </div>
      </aside>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-logo"><span class="logo-s">Suzy</span><span class="logo-c">Coiffure</span></div>
    <p data-i18n="foot.tag"></p>
    <p><a class="insta" href="https://www.instagram.com/salon_suzycoiffure/" target="_blank" rel="noopener">Instagram · @salon_suzycoiffure</a></p>
    <p class="muted">© <span id="year"></span> Suzy Coiffure · Rue des Chavannes 13, 2000 Neuchâtel · 076 321 32 39</p>
    <p class="muted small" data-i18n="foot.demo"></p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="i18n.js"></script>
<script src="pages.js"></script>
</body>
</html>
